# Why nothing is segregated
#   Every pair carries `story`, and `machine_model` where known. Crepuscular's
#   2 July pass edits a Fable 5 rewrite rather than AUTO_MODE output, so its
#   displacement has a different origin model. Recording that per pair lets
#   Step 2 test whether it matters, which is strictly better than holding the
#   story out and never finding out.

# Global filters confirmed by jhave
filters:
  drop_identical_spans: true   # before == after after whitespace normalisation
                               # measured: 24 of 776 spans (3.1%) carry no signal
  published_substitutions_only: true

# OPEN — not in the corpus, awaiting jhave
open_questions:
  github_web_editor_signal:
    status: newly-identified
    finding: >
      Commit AUTHOR plus message pattern is a stronger provenance signal than
      anything used so far. 25 draft commits across all branches match
      "^Update <file>.md", the GitHub web editor's default message, and all 25
      are authored by jhave. This is the practice jhave described adopting:
      editing on GitHub and committing. Author alone is NOT sufficient — 64 of 79
      draft commits are authored by jhave, because Claude Code sessions commit
      under his identity too. The message pattern is what separates them.
    distribution:
      25-06-2026_Crepuscular: 10        # unmerged branch
      26-06-2026_The_First_Water_Molecule: 6   # already captured
      20-07-2026_Open_Loops: 4          # NOT yet captured, only published diff used
      30-07-2026_Interim_Edge: 1
      25-07-2026_Devora: 1              # story not in corpus
      09-05-2026_Slime: 1               # jhave marked this story ambiguous
      08-07-2026_Tina_Sinclair: 1       # story not in corpus
    decision_needed: >
      Four sources here are unused: Open_Loops web edits, Devora, Tina_Sinclair,
      and one confirmed hand edit in Slime despite the story being excluded.

  other_unmerged_stories:
    status: checked-no-yield
    detail: >
      22-05-2026_Mature_Water (claude/recent-unfinished-story-CG1N8) and
      31-07-2026_Alpha-Gaia (claude/alpha-gaia-story) are also absent from main.
      Neither has any web-editor commit, so neither yields pairs.
