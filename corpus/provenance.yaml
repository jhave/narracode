# Provenance ledger — substep 1.2
# Source: jhave, confirmed 2026-08-06, from 2026-08-05_provenance-diff-review.html
#
# RULES THE EXTRACTOR APPLIES
#   pair emitted only for machine -> human, both usable: true
#   unknown on either side  -> no pair
#   machine -> machine      -> no pair
#   human   -> human        -> no immediate pair; see cumulative rule below
#
# CUMULATIVE RULE (new, see 1.4 note)
#   For a maximal run of consecutive human snapshots H1..Hn preceded by a
#   machine snapshot M, emit both:
#     M -> H1   pair_type: immediate   (the first correction)
#     M -> Hn   pair_type: cumulative  (the total correction)
#   Without this, stories whose edits are all human yield almost nothing.

